# the bare-metal counts alone, and their documents (snapshot branch only)
name: mcu-probe
on:
  workflow_dispatch:
jobs:
  board:
    strategy:
      fail-fast: false
      matrix:
        target: [m33]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake --preset ${{ matrix.target }}
      - name: Build
        run: cmake --build --preset ${{ matrix.target }} -j 4
      - name: Test
        run: ctest --preset ${{ matrix.target }} -L smallcheck -j 4
      - name: Benchmark
        run: time bash scripts/benchmark build/${{ matrix.target }} results/cortex-${{ matrix.target }}-qemu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcu-${{ matrix.target }}
          path: results
          retention-days: 7
  esp32:
    strategy:
      fail-fast: false
      matrix:
        target: [esp32]
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python3 "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa
          . "$IDF_PATH/export.sh"
          idf.py -C support/esp32 -B "$PWD/build/${{ matrix.target }}" set-target ${{ matrix.target }} build
          timeout 600 idf.py -C support/esp32 -B "$PWD/build/${{ matrix.target }}" qemu --qemu-extra-args=-no-reboot < /dev/null | tee serial.log
          [ "$(grep -c "all checks passed" serial.log)" -eq 2 ] && ! grep -q FAIL serial.log
      - name: Benchmark
        if: always()
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          time bash support/esp32/count/benchmark results/${{ matrix.target }}-qemu ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcu-${{ matrix.target }}
          path: results
          retention-days: 7
  documents:
    needs: [board, esp32]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q grace gnuplot-nox
      - uses: actions/download-artifact@v4
        with:
          pattern: mcu-*
          path: dl
      - name: Documents
        run: |
          for d in dl/*/*/; do
            sh scripts/collect "$d" out benchmark || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-probe
          path: out
          retention-days: 7
