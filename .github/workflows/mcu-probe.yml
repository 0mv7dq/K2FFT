# the bare-metal counts alone (snapshot branch only)
name: mcu-probe
on:
  push:
    branches: [snapshot]
  workflow_dispatch:
jobs:
  board:
    strategy:
      fail-fast: false
      matrix:
        target: [m7, m4]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake --preset ${{ matrix.target }}
      - name: Build
        run: cmake --build --preset ${{ matrix.target }} -j 4
      - name: Test
        run: ctest --preset ${{ matrix.target }} -L smallcheck -j 4
      - name: Benchmark
        run: time bash scripts/benchmark build/${{ matrix.target }} results/cortex-${{ matrix.target }}-qemu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcu-${{ matrix.target }}
          path: results
          retention-days: 7
