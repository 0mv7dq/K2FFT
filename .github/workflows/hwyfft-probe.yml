# rdft/hwyfft.cpp's checks where no local compiler is (snapshot branch only): MSVC's x64 and ARM64, Apple's, and QEMU's
# ppc64le, s390x, i686, mips64el and armhf; the kernel and its benchee alone
name: hwyfft-probe
on:
  push: # only so GitHub knows the workflow; the jobs run when dispatched
    branches: [snapshot]
  workflow_dispatch:
jobs:
  native:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-11-arm
            cmake: -A ARM64
          - runner: windows-2025
            cmake: -A x64
          - runner: macos-15
            cmake: "'-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake --preset native ${{ matrix.cmake }}
      - name: Build
        run: cmake --build --preset native -j 3 --target K2FFT_check_fft_hwyfft hwyfft_bench
      - name: Test
        run: ctest --preset native -R '^(K2FFT_fft_hwyfft|hwyfft_smallcheck|hwyfft_verify)$'

  cross:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ppc64le
            packages: g++-powerpc64le-linux-gnu
          - target: s390x
            packages: g++-s390x-linux-gnu
          - target: i686
            packages: g++-i686-linux-gnu
          - target: mips64el
            packages: g++-mips64el-linux-gnuabi64
          - target: armhf
            packages: g++-arm-linux-gnueabihf
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Install dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -q
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=300 install -y -q cmake qemu-user ${{ matrix.packages }}
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake --preset ${{ matrix.target }}
      - name: Build
        run: cmake --build --preset ${{ matrix.target }} -j 4 --target K2FFT_check_fft_hwyfft hwyfft_bench
      - name: Test
        run: ctest --preset ${{ matrix.target }} -R '^(K2FFT_fft_hwyfft|hwyfft_smallcheck|hwyfft_verify)$'
