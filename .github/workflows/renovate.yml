# every dependency's newest version, nightly, as one PR that check.yml tests (renovate.json)
# RENOVATE_TOKEN: a token that may push branches and open PRs (contents, pull requests, workflows, issues)
name: renovate
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
jobs:
  renovate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # renovate's engines
      - name: Renovate
        run: npx --yes renovate@latest
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_ALLOWED_COMMANDS: '["^cmake -P cmake/sha256\\.cmake$"]' # the SHA256s of the CMake-pinned downloads
          LOG_LEVEL: info
