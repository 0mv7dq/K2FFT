# snapshot branch only: whether QEMU 8.2.2 built w/ plugins (Ubuntu's qemu-user loads none) and tools/insn.c count what
# -one-insn-per-tb -d exec's lines count, and how much faster, on arm64 benchees; fills the cache check.yml's QEMU jobs use
name: qemu-plugin
on:
  push: # only so GitHub knows the workflow; the job runs when dispatched
    branches: [snapshot]
  workflow_dispatch:
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        timeout-minutes: 20
        run: sudo apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=300 install -y -q cmake g++-aarch64-linux-gnu qemu-user ninja-build libglib2.0-dev python3-venv
      - uses: actions/cache@v4
        id: qemu
        with:
          path: ~/qemu
          key: qemu-8.2.2-aarch64-plugins
      - name: QEMU w/ plugins
        if: steps.qemu.outputs.cache-hit != 'true'
        timeout-minutes: 40
        run: |
          curl -sSfL --retry 3 -o qemu.tar.xz https://download.qemu.org/qemu-8.2.2.tar.xz
          echo "847346c1b82c1a54b2c38f6edbd85549edeb17430b7d4d3da12620e2962bc4f3  qemu.tar.xz" | sha256sum -c
          tar xJf qemu.tar.xz
          cd qemu-8.2.2
          ./configure --prefix="$HOME/qemu" --target-list=aarch64-linux-user --enable-plugins --disable-system --disable-tools --disable-docs --disable-werror | tail -5
          make -j4 install > /dev/null
      - name: Build
        run: |
          cmake --preset arm64
          cmake --build --preset arm64 -j 4 --target pffft_count fftw3_count K2FFT_count hwyfft_count
      - name: Compare
        run: |
          D=$(sed -n 's/^K2FFT_BINARY_DIR:[A-Z]*=//p' build/arm64/CMakeCache.txt)
          cc -O2 -Wall -Wextra -shared -fPIC -o insn.so tools/insn.c
          Q="qemu-aarch64 -L /usr/aarch64-linux-gnu -cpu cortex-a72"
          P="$HOME/qemu/bin/qemu-aarch64 -L /usr/aarch64-linux-gnu -cpu cortex-a72"
          $P -h | grep -- '-plugin' | head -1
          for b in pffft fftw3 K2FFT hwyfft; do
            for n in 64 1024 65536; do
              for r in 1 3; do
                t0=$(date +%s.%N)
                a=$($Q -E LD_BIND_NOW=1 -E K2FFT_NORACE=1 -one-insn-per-tb -d exec,nochain "$D/bin/$b/count" -oestimate $n $r 2>&1 > /dev/null | grep -c '^Trace')
                t1=$(date +%s.%N)
                c=$($P -E LD_BIND_NOW=1 -E K2FFT_NORACE=1 -plugin ./insn.so -d plugin "$D/bin/$b/count" -oestimate $n $r 2>&1 > /dev/null | sed -n 's/^insns //p')
                t2=$(date +%s.%N)
                echo "$b n $n reps $r: trace $a ($(awk "BEGIN {print $t1-$t0}") s) plugin $c ($(awk "BEGIN {print $t2-$t1}") s) $([ "$a" = "$c" ] && echo same || echo DIFFERENT)"
              done
            done
          done | tee -a "$GITHUB_STEP_SUMMARY"
