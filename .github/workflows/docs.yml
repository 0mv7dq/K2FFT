# collect's documents and desc2web.sh's pages from finished runs' results, with this commit's scripts (snapshot branch only)
name: docs
on:
  push: # only so GitHub knows the workflow; the job runs when dispatched
    branches: [snapshot]
  workflow_dispatch:
    inputs:
      run:
        description: the runs' ids (check, iotlab), space-separated
        required: true
permissions:
  actions: read
  contents: read
jobs:
  documents:
    if: inputs.run
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-matplotlib guile-3.0
      - name: Results
        run: |
          for r in ${{ inputs.run }}; do
            gh run download "$r" -R "$GITHUB_REPOSITORY" -p 'bench-*' -D results
          done
          for d in results/bench-*; do
            [ -d "$d" ] || continue
            mv "$d" "results/${d#results/bench-}"
          done
          ls results
      - name: Documents
        run: |
          status=0
          for d in results/*/; do
            sh scripts/collect "$d" docs/benchmark benchmark >> verdicts.txt 2>&1 || status=1
          done
          { echo '```'; cat verdicts.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat verdicts.txt
          exit $status
      - name: Pages
        if: always()
        run: |
          first=$(echo ${{ inputs.run }} | cut -d' ' -f1)
          sh scripts/desc2web.sh docs/benchmark docs/bench "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$first"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark
          path: docs/benchmark
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages
          path: docs/bench
          retention-days: 14
