# macOS, Win, ARM64, ESP32 w/ Private CI

name: check
on:
  pull_request: # Renovate's updates among them
  workflow_dispatch:
    inputs:
      linux:
        description:
        type: boolean
        default: true
      benchmark: # every job runs scripts/benchmark on what it built; the benchmark job makes the documents
        type: boolean
        default: false
      classes: # the problems it times (scripts/benchmark's K2FFT_CLASSES), as "srofN scofN dcobN"
        type: string
        default: srofN
env:
  K2FFT_CLASSES: ${{ inputs.classes || 'srofN' }}
jobs:
  classes: # a benchmark's jobs, one a class and machine, so none nears 6 h; checks take them all in one
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - id: list
        run: |
          set -f
          if [ "${{ inputs.benchmark }}" = true ]; then set -- $K2FFT_CLASSES; else set -- "$K2FFT_CLASSES"; fi
          echo "list=$(printf '%s\n' "$@" | jq -Rcs 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  native:
    needs: classes
    name: native ${{ matrix.machine.bench }} ${{ matrix.class }}
    env:
      K2FFT_CLASSES: ${{ matrix.class }}
    strategy:
      fail-fast: false
      matrix:
        class: ${{ fromJSON(needs.classes.outputs.list) }}
        machine:
          - runner: macos-15 # vDSP, both slices
            cmake: "'-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'"
            bench: macos-arm64
            jobs: 3
          - runner: macos-15-intel # KFR
            bench: macos-x64
            jobs: 2
          - runner: macos-15-intel # the universal build's x86-64 slice, which runs vDSP and PFFFT
            cmake: "'-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'"
            bench: macos-x64-universal
            jobs: 2
          - runner: ubuntu-24.04-arm # Ne10 against PFFFT; Clang, which builds Ne10 and KFR faster there than GCC
            setup: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=300 install -y -q cmake g++ clang
            cmake: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            bench: linux-arm64
            jobs: 4
          - runner: windows-2025 # IPP
            cmake: -A x64
            bench: windows-x64
            jobs: 2
          - runner: windows-11-arm # PFFFT's NEON
            cmake: -A ARM64
            bench: windows-arm64
            jobs: 2
    runs-on: ${{ matrix.machine.runner }}
    timeout-minutes: 360 # GitHub's most
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        if: matrix.machine.setup
        timeout-minutes: 20
        run: ${{ matrix.machine.setup }}
      - name: Configure
        run: cmake --preset native ${{ matrix.machine.cmake }}
      - name: Build
        run: cmake --build --preset native -j ${{ matrix.machine.jobs }}
      - name: Test
        run: ctest --preset native -L smallcheck -j ${{ matrix.machine.jobs }}
      - name: Benchmark
        if: inputs.benchmark
        run: bash scripts/benchmark build/native results/${{ matrix.machine.bench }}
      - uses: actions/upload-artifact@v4
        if: always() && inputs.benchmark
        with:
          name: bench-${{ matrix.machine.bench }}-${{ strategy.job-index }} # the benchmark job's collect strips the index
          path: results/${{ matrix.machine.bench }}
          if-no-files-found: ignore
          retention-days: 14

  riscv64: # a real RISC-V board (RISE's runners)
    if: inputs.benchmark
    needs: classes
    name: riscv64 ${{ matrix.class }}
    env:
      K2FFT_CLASSES: ${{ matrix.class }}
    strategy:
      fail-fast: false
      matrix:
        class: ${{ fromJSON(needs.classes.outputs.list) }}
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360 # GitHub's most
    steps:
      - name: Install dependencies
        timeout-minutes: 20 # a stalled mirror fails fast
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -q
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=300 install -y -q cmake g++
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake --preset native
      - name: Build
        run: cmake --build --preset native -j $(nproc)
      - name: Test
        run: ctest --preset native -L smallcheck -j $(nproc)
      - name: Benchmark
        run: K2FFT_ACCURACY=p2 bash scripts/benchmark build/native results/linux-riscv64 3 # a slow board: 5 rounds and accuracy at every size outran 6 h
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-linux-riscv64-${{ strategy.job-index }}
          path: results/linux-riscv64
          if-no-files-found: ignore
          retention-days: 14

  mingw:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake --preset native -G Ninja
      - name: Build
        run: cmake --build --preset native -j 4
      - name: Test
        run: ctest --preset native -L smallcheck -j 4

  esp32: # ESP-DSP + PFFFT on emulated ESP32-S3 and ESP32
    needs: classes
    name: esp32 ${{ matrix.target }} ${{ matrix.class }}
    env:
      K2FFT_CLASSES: ${{ matrix.class }}
    strategy:
      fail-fast: false
      matrix:
        class: ${{ fromJSON(needs.classes.outputs.list) }}
        target: [esp32s3, esp32]
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python3 "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa
          . "$IDF_PATH/export.sh"
          idf.py -C support/esp32 -B "$PWD/build/${{ matrix.target }}" set-target ${{ matrix.target }} build
          timeout 600 idf.py -C support/esp32 -B "$PWD/build/${{ matrix.target }}" qemu --qemu-extra-args=-no-reboot < /dev/null | tee serial.log
          [ "$(grep -c "all checks passed" serial.log)" -eq 2 ] && ! grep -q FAIL serial.log
          mkdir -p "results/${{ matrix.target }}-qemu" && { cat serial.log; echo "exit 0"; } > "results/${{ matrix.target }}-qemu/ctest.txt"
      - name: Benchmark # QEMU's instruction counts, as scripts/benchmark's for bare metal
        if: inputs.benchmark
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          bash support/esp32/count/benchmark results/${{ matrix.target }}-qemu ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always() && inputs.benchmark
        with:
          name: bench-${{ matrix.target }}-qemu-${{ strategy.job-index }}
          path: results/${{ matrix.target }}-qemu
          if-no-files-found: ignore
          retention-days: 14

  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    needs: classes
    name: linux ${{ matrix.machine.target }} ${{ matrix.class }}
    env:
      K2FFT_CLASSES: ${{ matrix.class }}
    strategy:
      fail-fast: false
      matrix:
        class: ${{ fromJSON(needs.classes.outputs.list) }}
        machine:
          - target: native
            packages: g++
            bench: linux-x64
          - target: arm64
            packages: g++-aarch64-linux-gnu qemu-user
            bench: linux-arm64-qemu
            qemu: aarch64
          - target: armhf
            packages: g++-arm-linux-gnueabihf qemu-user
            bench: linux-armhf-qemu
            qemu: arm
          - target: armv6
            packages: g++-arm-linux-gnueabihf qemu-user
            bench: linux-armv6-qemu
            qemu: arm
          - target: riscv64
            packages: g++-14-riscv64-linux-gnu qemu-user
            bench: linux-riscv64-qemu
            qemu: riscv64
          - target: armel # checks alone: soft-float traces take hours, and armhf and armv6 count 32-bit ARM
            packages: g++-arm-linux-gnueabi qemu-user
          - target: i686
            packages: g++-i686-linux-gnu qemu-user
            bench: linux-i686-qemu
            qemu: i386
          - target: ppc64le
            packages: g++-powerpc64le-linux-gnu qemu-user
            bench: linux-ppc64le-qemu
            qemu: ppc64le
          - target: s390x
            packages: g++-s390x-linux-gnu qemu-user
            bench: linux-s390x-qemu
            qemu: s390x
          - target: mips64el
            packages: g++-mips64el-linux-gnuabi64 qemu-user
            bench: linux-mips64el-qemu
            qemu: mips64el
          - target: x64-qemu64 # x86-64's baseline, where IPP and the AVX2 kernels can't run
            packages: g++ qemu-user
            bench: linux-x64-qemu-v1
            qemu: x86_64
          - target: x64-nehalem # SSE4.2 w/o AVX
            packages: g++ qemu-user
            bench: linux-x64-qemu-v2
            qemu: x86_64
          - target: m7
            packages: gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm
            bench: cortex-m7-qemu
          - target: m4
            packages: gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm
            bench: cortex-m4-qemu
          - target: m55
            packages: gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm
            bench: cortex-m55-qemu
          - target: m33
            packages: gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm
            bench: cortex-m33-qemu
    runs-on: ubuntu-24.04
    timeout-minutes: 360 # GitHub's most
    steps:
      - name: Install dependencies
        timeout-minutes: 20 # a stalled mirror fails fast
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -q
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=300 install -y -q cmake ${{ matrix.machine.packages }}
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake --preset ${{ matrix.machine.target }}
      - name: Build
        run: cmake --build --preset ${{ matrix.machine.target }} -j 4
      - name: Test
        run: ctest --preset ${{ matrix.machine.target }} -L smallcheck -j 4
      - uses: actions/cache@v4
        if: inputs.benchmark && matrix.machine.qemu
        id: qemu
        with:
          path: ~/qemu
          key: qemu-8.2.2-${{ matrix.machine.qemu }}-plugins
      - name: QEMU w/ plugins # Ubuntu's qemu-user loads none; scripts/benchmark counts w/ tools/insn.c then, not a trace line per instruction
        if: inputs.benchmark && matrix.machine.qemu && steps.qemu.outputs.cache-hit != 'true'
        timeout-minutes: 40
        run: |
          sudo apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=300 install -y -q ninja-build libglib2.0-dev python3-venv
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/qemu.tar.xz" https://download.qemu.org/qemu-8.2.2.tar.xz
          echo "847346c1b82c1a54b2c38f6edbd85549edeb17430b7d4d3da12620e2962bc4f3  $RUNNER_TEMP/qemu.tar.xz" | sha256sum -c
          tar xJf "$RUNNER_TEMP/qemu.tar.xz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/qemu-8.2.2"
          ./configure --prefix="$HOME/qemu" --target-list=${{ matrix.machine.qemu }}-linux-user --enable-plugins --disable-system --disable-tools --disable-docs --disable-werror | tail -3
          make -j4 install > /dev/null
      - name: Benchmark # QEMU's targets get instruction counts, not times
        if: inputs.benchmark && matrix.machine.bench
        run: |
          [ -z "${{ matrix.machine.qemu }}" ] || export PATH="$HOME/qemu/bin:$PATH" # before Ubuntu's
          bash scripts/benchmark build/${{ matrix.machine.target }} results/${{ matrix.machine.bench }}
      - uses: actions/upload-artifact@v4
        if: always() && inputs.benchmark && matrix.machine.bench
        with:
          name: bench-${{ matrix.machine.bench }}-${{ strategy.job-index }}
          path: results/${{ matrix.machine.bench }}
          if-no-files-found: ignore
          retention-days: 14

  benchmark: # each machine's documents into benchmark/ (scripts/collect), then kernel/table.h and bench/'s pages from them, committed on the run's branch
    needs: [native, linux, riscv64, esp32]
    if: always() && inputs.benchmark
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        timeout-minutes: 20 # a stalled mirror fails fast
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -q
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=300 install -y -q python3-matplotlib guile-3.0
      - uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          path: results
      - name: Documents
        run: |
          status=0
          for d in results/bench-*; do # a job a class: each into benchmark/ before the machine's next, whose collect keeps its classes
            [ -d "$d" ] || continue
            b=${d#results/bench-}
            case "${b##*-}" in *[!0-9]*) ;; *) b=${b%-*};; esac # w/o the job's index
            rm -rf work && mkdir work && mv "$d" "work/$b"
            sh scripts/collect "work/$b" out benchmark >> verdicts.txt 2>&1 || status=1
            for m in out/*/; do
              [ -d "$m" ] || continue
              rm -rf "benchmark/$(basename "$m")"
              mv "$m" benchmark/
            done
          done
          { echo '```'; cat verdicts.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat verdicts.txt
          exit $status
      - name: Table and pages # every machine's documents, this run's replacing its machines'
        if: ${{ !cancelled() }}
        run: |
          sh scripts/table benchmark > kernel/table.h
          sh scripts/desc2web.sh benchmark bench "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Commit
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark bench kernel/table.h
          git commit -q -m "benchmark: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || exit 0
          for i in 1 2 3; do # another run's commit may land first
            git pull -q --rebase -X theirs origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 15
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark
          path: |
            benchmark
            bench
          retention-days: 14
