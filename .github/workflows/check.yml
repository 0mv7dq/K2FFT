# macOS, Win, ARM64, ESP32 w/ Private CI

name: check
on:
  pull_request: # Renovate's updates among them
  workflow_dispatch:
    inputs:
      linux:
        description:
        type: boolean
        default: true
      benchmark: # every job runs scripts/benchmark on what it built; the benchmark job makes the documents
        type: boolean
        default: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15 # vDSP, both slices
            cmake: "'-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'"
            bench: macos-arm64
            jobs: 3
          - runner: macos-15-intel # KFR
            bench: macos-x64
            jobs: 2
          - runner: macos-15-intel # the universal build's x86-64 slice, which runs vDSP and PFFFT
            cmake: "'-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'"
            bench: macos-x64-universal
            jobs: 2
          - runner: ubuntu-24.04-arm # Ne10 against PFFFT; Clang, which builds Ne10 and KFR faster there than GCC
            setup: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=300 install -y -q cmake g++ clang
            cmake: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            bench: linux-arm64
            jobs: 4
          - runner: windows-2025 # IPP
            cmake: -A x64
            bench: windows-x64
            jobs: 2
          - runner: windows-11-arm # PFFFT's NEON
            cmake: -A ARM64
            bench: windows-arm64
            jobs: 2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360 # GitHub's most
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        if: matrix.setup
        timeout-minutes: 20
        run: ${{ matrix.setup }}
      - name: Configure
        run: cmake --preset native ${{ matrix.cmake }}
      - name: Build
        run: cmake --build --preset native -j ${{ matrix.jobs }}
      - name: Test
        run: ctest --preset native -L smallcheck -j ${{ matrix.jobs }}
      - name: Benchmark
        if: inputs.benchmark
        run: bash scripts/benchmark build/native results/${{ matrix.bench }}
      - uses: actions/upload-artifact@v4
        if: always() && inputs.benchmark
        with:
          name: bench-${{ matrix.bench }}
          path: results/${{ matrix.bench }}
          if-no-files-found: ignore
          retention-days: 14

  riscv64: # a real RISC-V board (RISE's runners)
    if: inputs.benchmark
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360 # GitHub's most
    steps:
      - name: Install dependencies
        timeout-minutes: 20 # a stalled mirror fails fast
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -q
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=300 install -y -q cmake g++
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake --preset native
      - name: Build
        run: cmake --build --preset native -j $(nproc)
      - name: Test
        run: ctest --preset native -L smallcheck -j $(nproc)
      - name: Benchmark
        run: bash scripts/benchmark build/native results/linux-riscv64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-linux-riscv64
          path: results/linux-riscv64
          if-no-files-found: ignore
          retention-days: 14

  mingw:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake --preset native -G Ninja
      - name: Build
        run: cmake --build --preset native -j 4
      - name: Test
        run: ctest --preset native -L smallcheck -j 4

  esp32: # ESP-DSP + PFFFT on emulated ESP32-S3 and ESP32
    strategy:
      fail-fast: false
      matrix:
        target: [esp32s3, esp32]
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python3 "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa
          . "$IDF_PATH/export.sh"
          idf.py -C support/esp32 -B "$PWD/build/${{ matrix.target }}" set-target ${{ matrix.target }} build
          timeout 600 idf.py -C support/esp32 -B "$PWD/build/${{ matrix.target }}" qemu --qemu-extra-args=-no-reboot < /dev/null | tee serial.log
          [ "$(grep -c "all checks passed" serial.log)" -eq 2 ] && ! grep -q FAIL serial.log
          mkdir -p "results/${{ matrix.target }}-qemu" && { cat serial.log; echo "exit 0"; } > "results/${{ matrix.target }}-qemu/ctest.txt"
      - name: Benchmark # QEMU's instruction counts, as scripts/benchmark's for bare metal
        if: inputs.benchmark
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          bash support/esp32/count/benchmark results/${{ matrix.target }}-qemu ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always() && inputs.benchmark
        with:
          name: bench-${{ matrix.target }}-qemu
          path: results/${{ matrix.target }}-qemu
          if-no-files-found: ignore
          retention-days: 14

  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: native
            packages: g++
            bench: linux-x64
          - target: arm64
            packages: g++-aarch64-linux-gnu qemu-user
            bench: linux-arm64-qemu
          - target: armhf
            packages: g++-arm-linux-gnueabihf qemu-user
            bench: linux-armhf-qemu
          - target: armv6
            packages: g++-arm-linux-gnueabihf qemu-user
            bench: linux-armv6-qemu
          - target: riscv64
            packages: g++-14-riscv64-linux-gnu qemu-user
            bench: linux-riscv64-qemu
          - target: armel # checks alone: soft-float traces take hours, and armhf and armv6 count 32-bit ARM
            packages: g++-arm-linux-gnueabi qemu-user
          - target: i686
            packages: g++-i686-linux-gnu qemu-user
            bench: linux-i686-qemu
          - target: ppc64le
            packages: g++-powerpc64le-linux-gnu qemu-user
            bench: linux-ppc64le-qemu
          - target: s390x
            packages: g++-s390x-linux-gnu qemu-user
            bench: linux-s390x-qemu
          - target: mips64el
            packages: g++-mips64el-linux-gnuabi64 qemu-user
            bench: linux-mips64el-qemu
          - target: x64-qemu64 # x86-64's baseline, where IPP and the AVX2 kernels can't run
            packages: g++ qemu-user
            bench: linux-x64-qemu-v1
          - target: x64-nehalem # SSE4.2 w/o AVX
            packages: g++ qemu-user
            bench: linux-x64-qemu-v2
          - target: m7
            packages: gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm
            bench: cortex-m7-qemu
          - target: m4
            packages: gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm
            bench: cortex-m4-qemu
          - target: m55
            packages: gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm
            bench: cortex-m55-qemu
          - target: m33
            packages: gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm
            bench: cortex-m33-qemu
    runs-on: ubuntu-24.04
    timeout-minutes: 360 # GitHub's most
    steps:
      - name: Install dependencies
        timeout-minutes: 20 # a stalled mirror fails fast
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -q
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=300 install -y -q cmake ${{ matrix.packages }}
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake --preset ${{ matrix.target }}
      - name: Build
        run: cmake --build --preset ${{ matrix.target }} -j 4
      - name: Test
        run: ctest --preset ${{ matrix.target }} -L smallcheck -j 4
      - name: Benchmark # QEMU's targets get instruction counts, not times
        if: inputs.benchmark && matrix.bench
        run: bash scripts/benchmark build/${{ matrix.target }} results/${{ matrix.bench }}
      - uses: actions/upload-artifact@v4
        if: always() && inputs.benchmark && matrix.bench
        with:
          name: bench-${{ matrix.bench }}
          path: results/${{ matrix.bench }}
          if-no-files-found: ignore
          retention-days: 14

  benchmark: # each machine's documents into benchmark/ (scripts/collect), then kernel/table.h and bench/'s pages from them, committed on the run's branch
    needs: [native, linux, riscv64, esp32]
    if: always() && inputs.benchmark
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        timeout-minutes: 20 # a stalled mirror fails fast
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -q
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=300 install -y -q python3-matplotlib guile-3.0
      - uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          path: results
      - name: Documents
        run: |
          status=0
          for d in results/bench-*; do
            [ -d "$d" ] || continue
            mv "$d" "results/${d#results/bench-}"
          done
          for d in results/*/; do
            sh scripts/collect "$d" out benchmark >> verdicts.txt 2>&1 || status=1
          done
          { echo '```'; cat verdicts.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat verdicts.txt
          exit $status
      - name: Table and pages # every machine's documents, this run's replacing its machines'
        if: ${{ !cancelled() }}
        run: |
          for m in out/*/; do
            [ -d "$m" ] || continue
            rm -rf "benchmark/$(basename "$m")"
            mv "$m" benchmark/
          done
          sh scripts/table benchmark > kernel/table.h
          sh scripts/desc2web.sh benchmark bench "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Commit
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark bench kernel/table.h
          git commit -q -m "benchmark: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || exit 0
          for i in 1 2 3; do # another run's commit may land first
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 15
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark
          path: |
            benchmark
            bench
          retention-days: 14
